<svg xmlns="http://www.w3.org/2000/svg" width="680" height="272" viewBox="0 0 680 272" role="img" aria-label="Hexwax">
<style>
.ink{fill:none;stroke:#1d1915;stroke-width:15;stroke-linecap:square;stroke-linejoin:miter;stroke-miterlimit:3}
.gold{fill:none;stroke:#f5a91c;stroke-width:15;stroke-linecap:square;stroke-linejoin:miter;stroke-miterlimit:3}
.cell{fill:#f5a91c;stroke:none} .gold-cell{fill:#1d1915}
.wing{fill:#fcd58a}
.trail{fill:none;stroke:#e9b860;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:3 5}

@media (prefers-reduced-motion:no-preference){
 .draw{stroke-dasharray:1;animation:draw .55s cubic-bezier(.6,0,.2,1) both}
 .cell{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
 .hover{animation:hover 3.2s ease-in-out infinite}
 .wing{transform-box:fill-box;animation:flap .16s ease-in-out infinite alternate}
 .wl{transform-origin:100% 80%} .wr{transform-origin:0% 80%}
 .trail{animation:flow 1.4s linear infinite}
}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(0) rotate(-60deg)}100%{transform:scale(1) rotate(0)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.72)}}
@keyframes flow{to{stroke-dashoffset:-16}}
</style>
